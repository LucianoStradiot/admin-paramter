_schema-version: "3.2"
ID: z_admin_parameters
version: 0.0.1
modules:
- name: z_admin_parameters-destination-content
  type: com.sap.application.content
  requires:
  - name: z_admin_parameters-destination-service
    parameters:
      content-target: true
  - name: z_admin_parameters_html_repo_host
    parameters:
      service-key:
        name: z_admin_parameters_html_repo_host-key
  - name: uaa_z_admin_parameters
    parameters:
      service-key:
        name: uaa_z_admin_parameters-key
  parameters:
    content:
      instance:
        destinations:
        - Name: z_admin_parameters_z_admin_parameters_html_repo_host
          ServiceInstanceName: z_admin_parameters-html5-app-host-service
          ServiceKeyName: z_admin_parameters_html_repo_host-key
          sap.cloud.service: z_admin_parameters
        - Authentication: OAuth2UserTokenExchange
          Name: z_admin_parameters_uaa_z_admin_parameters
          ServiceInstanceName: z_admin_parameters-xsuaa-service
          ServiceKeyName: uaa_z_admin_parameters-key
          sap.cloud.service: z_admin_parameters
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: z_admin_parameters-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: z_admin_parameters_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comclaroproveedoresadminparameters.zip
      name: comclaroproveedoresadminparameters
      target-path: resources/
- name: comclaroproveedoresadminparameters
  type: html5
  path: adminparameters
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: z_admin_parameters-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: z_admin_parameters-destination-service
    service-plan: lite
- name: z_admin_parameters_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: z_admin_parameters-html5-app-host-service
    service-plan: app-host
- name: uaa_z_admin_parameters
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: z_admin_parameters-xsuaa-service
    service-plan: application
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
